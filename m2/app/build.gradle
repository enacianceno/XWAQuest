plugins { id 'com.android.application' }
configurations { openxrRuntime }
android {
    namespace 'org.openxwa.xwaquest.m2'
    compileSdk 35
    buildToolsVersion '33.0.1'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.openxwa.xwaquest.m2'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.2-M2-linkcheck'
        ndk { abiFilters 'arm64-v8a' }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/openxrJni')
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/engineJni')
    // JNI_OnLoad registers SDL's real Java bindings even in a load-only test.
    // LoadCheckActivity remains a plain Activity and never runs SDL_main.
    sourceSets.main.java.srcDir "${rootProject.projectDir}/../../third_party/SDL3/android-project/app/src/main/java"
    // Generated SPIR-V and engine-owned resources only; never GameData.
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/engineAssets')
    buildTypes { debug { debuggable true } }
}
dependencies { openxrRuntime 'org.khronos.openxr:openxr_loader_for_android:1.1.43@aar' }
tasks.register('extractOpenXRLoader', Sync) {
    from({ configurations.openxrRuntime.collect { zipTree(it) } }) {
        include 'prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so'
        eachFile { path = 'arm64-v8a/libopenxr_loader.so' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('generated/openxrJni')
}
tasks.register('buildM2Native', Exec) {
    commandLine 'pwsh', '-NoProfile', '-File', rootProject.file('Build-Target.ps1').absolutePath
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('extractOpenXRLoader'), tasks.named('buildM2Native')
}
