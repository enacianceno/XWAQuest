plugins { id 'com.android.application' }
configurations { openxrRuntime }
def sdlRoot = providers.gradleProperty('sdlRoot').getOrElse('../../third_party/SDL3')
android {
    namespace 'org.openxwa.xwaquest'
    compileSdk 35
    buildToolsVersion '33.0.1'
    packagingOptions { jniLibs { useLegacyPackaging true } }
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.openxwa.xwaquest'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1-M1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            arguments "-DSDL_ROOT=${file(sdlRoot).absolutePath.replace('\\','/')}", '-DANDROID_STL=c++_shared'
            targets 'main', 'SDL3-shared'
        } }
    }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir("generated/openxrJni")
    sourceSets.main.java.srcDir "${sdlRoot}/android-project/app/src/main/java"
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { debug { debuggable true } }
}
dependencies { openxrRuntime 'org.khronos.openxr:openxr_loader_for_android:1.1.43@aar' }
// SDL loads OpenXR dynamically. This AAR stores the loader in prefab, not jni/.
tasks.register('extractOpenXRLoader', Sync) {
    from({ configurations.openxrRuntime.collect { zipTree(it) } }) {
        include 'prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so'
        eachFile { path = 'arm64-v8a/libopenxr_loader.so' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('generated/openxrJni')
}
tasks.named('preBuild').configure { dependsOn tasks.named('extractOpenXRLoader') }

