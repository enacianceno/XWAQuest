plugins { id 'com.android.application' }
android {
    namespace 'org.openxwa.xwaquest.vrprobe'
    compileSdk 35
    buildToolsVersion '33.0.1'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.openxwa.xwaquest.vrprobe'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.0-VRPROBE'
        ndk { abiFilters 'arm64-v8a' }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/engineJni')
    sourceSets.main.java.srcDir "${rootProject.projectDir}/../../third_party/SDL3/android-project/app/src/main/java"
    sourceSets.main.assets.srcDir "${rootProject.projectDir}/../m2/app/build/generated/engineAssets"
    buildTypes { debug { debuggable true } }
}
tasks.register('buildVrProbeNative', Exec) {
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', rootProject.file('Build-Target.ps1').absolutePath
}
tasks.named('preBuild').configure { dependsOn tasks.named('buildVrProbeNative') }
